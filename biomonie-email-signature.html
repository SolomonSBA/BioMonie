<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biomonie email signature</title>
</head>
<body style="margin:0;padding:20px;background:#ffffff;">

<!--
  ============================================================
  HOW TO USE
  1. Export every image from Figma at 2x (PNG, or GIF for the animated banner).
  2. Upload them to a public HTTPS host (company CDN, S3, or biomonie.com/email/).
  3. Replace every https://biomonie.com/email/... URL below with your real one.
  4. Open this file in Chrome, select the signature (Ctrl/Cmd+A), copy,
     and paste into Gmail / Outlook signature settings.

  RULES THAT KEEP IT WORKING IN EMAIL
  - Tables only, inline CSS only. No flexbox, grid, JS or React.
  - Every <img> has width/height, alt text and display:block.
  - Safe fonts only (Georgia / Arial).
  ============================================================
-->

<!-- ============ SIGNATURE START ============ -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;max-width:600px;border-collapse:collapse;font-family:Georgia,'Times New Roman',serif;">
  <tr>

    <!-- ================= LEFT COLUMN (285px) ================= -->
    <td width="285" valign="top" style="width:285px;padding:0;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="285" style="width:285px;border-collapse:collapse;">

        <!-- ---- Navy block: logo + contact ---- -->
        <tr>
          <td bgcolor="#1B3A50" style="background-color:#1B3A50;padding:22px 14px 16px 12px;height:176px;" valign="top">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="259" style="width:259px;border-collapse:collapse;">
              <tr>
                <!-- Big yellow logo mark -->
                <td width="84" valign="top" style="width:84px;padding:0 10px 0 0;">
                  <img src="https://biomonie.com/email/logo-mark.png" width="84" height="118" alt="Biomonie" style="display:block;border:0;outline:none;width:84px;height:118px;">
                </td>

                <!-- Name + details -->
                <td valign="top" style="padding:0;">
                  <div style="font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:20px;font-weight:bold;color:#ffffff;letter-spacing:0.5px;">MIRACLE AMOS</div>
                  <div style="font-family:Georgia,'Times New Roman',serif;font-size:11px;line-height:16px;color:#ffffff;padding:1px 0 8px 0;">UX Designer</div>

                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                    <tr>
                      <td width="18" valign="middle" style="padding:0 6px 6px 0;">
                        <img src="https://biomonie.com/email/icon-mail.png" width="16" height="16" alt="Email" style="display:block;border:0;">
                      </td>
                      <td valign="middle" style="padding:0 0 6px 0;font-family:Georgia,'Times New Roman',serif;font-size:10px;line-height:14px;color:#ffffff;">
                        <a href="mailto:miracle@biomonie.com" style="color:#ffffff;text-decoration:none;">miracle@biomonie.com</a>
                      </td>
                    </tr>
                    <tr>
                      <td width="18" valign="middle" style="padding:0 6px 6px 0;">
                        <img src="https://biomonie.com/email/icon-phone.png" width="16" height="16" alt="Phone" style="display:block;border:0;">
                      </td>
                      <td valign="middle" style="padding:0 0 6px 0;font-family:Georgia,'Times New Roman',serif;font-size:10px;line-height:14px;color:#ffffff;">
                        <a href="tel:+2348077394817" style="color:#ffffff;text-decoration:none;">+234 (0) 807 739 4817</a>
                      </td>
                    </tr>
                    <tr>
                      <td width="18" valign="middle" style="padding:0 6px 0 0;">
                        <img src="https://biomonie.com/email/icon-web.png" width="16" height="16" alt="Website" style="display:block;border:0;">
                      </td>
                      <td valign="middle" style="padding:0;font-family:Georgia,'Times New Roman',serif;font-size:10px;line-height:14px;color:#ffffff;">
                        <a href="https://www.biomonie.com" style="color:#ffffff;text-decoration:none;">www.biomonie.com</a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td colspan="2" style="padding:10px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:14px;font-weight:bold;color:#ffffff;text-align:right;">
                  Biomonie Technologies Limited
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- ---- Grey block: wordmark + socials ---- -->
        <tr>
          <td bgcolor="#D9D9D9" style="background-color:#D9D9D9;padding:12px 10px 10px 12px;height:109px;" valign="top">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="263" style="width:263px;border-collapse:collapse;">
              <tr>
                <!-- Biomonie wordmark -->
                <td width="92" valign="middle" style="width:92px;padding:0 8px 0 0;">
                  <img src="https://biomonie.com/email/logo-wordmark.png" width="92" height="40" alt="Biomonie" style="display:block;border:0;">
                </td>

                <!-- Social icons + links -->
                <td valign="top" style="padding:0;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                    <tr>
                      <td style="padding:0 4px 5px 0;"><a href="https://facebook.com/biomonie"><img src="https://biomonie.com/email/social-facebook.png" width="18" height="18" alt="Facebook" style="display:block;border:0;"></a></td>
                      <td style="padding:0 4px 5px 0;"><a href="https://x.com/biomonie"><img src="https://biomonie.com/email/social-x.png" width="18" height="18" alt="X" style="display:block;border:0;"></a></td>
                      <td style="padding:0 4px 5px 0;"><a href="https://instagram.com/biomonie"><img src="https://biomonie.com/email/social-instagram.png" width="18" height="18" alt="Instagram" style="display:block;border:0;"></a></td>
                      <td style="padding:0 4px 5px 0;"><a href="https://youtube.com/biomonie"><img src="https://biomonie.com/email/social-youtube.png" width="18" height="18" alt="YouTube" style="display:block;border:0;"></a></td>
                      <td style="padding:0 4px 5px 0;"><a href="https://linkedin.com/company/biomonie"><img src="https://biomonie.com/email/social-linkedin.png" width="18" height="18" alt="LinkedIn" style="display:block;border:0;"></a></td>
                      <td style="padding:0 0 5px 0;"><a href="https://tiktok.com/@biomonie"><img src="https://biomonie.com/email/social-tiktok.png" width="18" height="18" alt="TikTok" style="display:block;border:0;"></a></td>
                    </tr>
                  </table>
                  <div style="font-family:Georgia,'Times New Roman',serif;font-size:8.5px;line-height:13px;color:#333333;">
                    <a href="https://facebook.com/biomonie" style="color:#333333;text-decoration:none;">Facebook.com/biomonie</a> &nbsp;|&nbsp;
                    <a href="https://x.com/biomonie" style="color:#333333;text-decoration:none;">X.com/biomonie</a><br>
                    <a href="https://instagram.com/biomonie" style="color:#333333;text-decoration:none;">Instagram.com/biomonie</a> &nbsp;|&nbsp;
                    <a href="https://youtube.com/biomonie" style="color:#333333;text-decoration:none;">Youtube.com/biomonie</a><br>
                    <a href="https://linkedin.com/company/biomonie" style="color:#333333;text-decoration:none;">Linkedin.com/biomonie</a>
                  </div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>

    <!-- ================= RIGHT COLUMN: banner (315 x 285) ================= -->
    <!--
      Export the whole right panel from Figma as ONE image at 630 x 570 (2x).
      For the animation, export it as an animated GIF instead (banner.gif).
      Keep the GIF under ~1 MB.
    -->
    <td width="315" valign="top" style="width:315px;padding:0;">
      <a href="https://www.biomonie.com" target="_blank" style="text-decoration:none;">
        <img src="https://biomonie.com/email/banner.png"
             width="315" height="285"
             alt="Biomonie: the first-ever global biometric cardless payment ecosystem. You work hard for your money. Just flex, pay or spend."
             style="display:block;border:0;outline:none;width:315px;height:285px;background-color:#1B3A50;color:#ffffff;font-family:Arial,sans-serif;font-size:12px;">
      </a>
    </td>

  </tr>
</table>
<!-- ============ SIGNATURE END ============ -->

</body>
</html>
